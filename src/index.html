<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <article class="card">
      <img src="images/sanfrancisco.png" alt="San Francisco" />

      <div class="card-content">
        <div class="card-header">
          <h2 class="card-title">San Francisco</h2>
          <p class="card-subtitle">Premium economy</p>
        </div>

        <div class="card-details">
          <div class="card-price">
            <img src="icons/label.svg" />
            <span>From <strong>900 CHF</strong></span>
          </div>

          <div class="card-airport">
            <img src="icons/airplane.svg" />
            <span><strong>SFO</strong></span>
          </div>
        </div>

        <div class="card-actions">
          <button class="btn btn-primary">Search flight</button>
          <button class="favorite-btn">
            <img src="icons/heart.svg" alt="favoris" />
          </button>
        </div>
      </div>
    </article>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
