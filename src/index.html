<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <form class="filters">
      <h2 class="filters__title">Start booking your flight now</h2>

      <fieldset class="filters__trip-type">
        <label>
          <input type="radio" name="trip" />
          One way
        </label>

        <label>
          <input type="radio" name="trip" checked />
          Round trip
        </label>
      </fieldset>

      <div class="filters__fields">
        <label class="filter-field">
          <span class="filter-field__label">From</span>
          <input type="text" value="Geneva" />
        </label>

        <button class="swap-button" type="button">
          <!-- SVG -->
        </button>

        <label class="filter-field">
          <span class="filter-field__label">To</span>
          <input type="text" value="San Francisco" />
        </label>

        <label class="filter-field">
          <span class="filter-field__label">From</span>
          <input type="date" />
        </label>

        <label class="filter-field">
          <span class="filter-field__label">Until</span>
          <input type="date" />
        </label>

        <label class="filter-field">
          <span class="filter-field__label">Passengers</span>
          <input type="number" min="1" value="1" />
        </label>

        <button class="btn-secondary">Search</button>
      </div>
    </form>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
