<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <form class="filters">
      <h2 class="filters__title">Start booking your flight now</h2>

      <fieldset class="filters__trip-type">
        <label>
          <input type="radio" name="trip" class="radio-input" />
          <span class="radio-visual"></span>
          One way
        </label>
        <label>
          <input type="radio" name="trip" class="radio-input" checked />
          <span class="radio-visual"></span>
          Round trip
        </label>
      </fieldset>

      <div class="filters__fields">
        <div class="route-field">
          <label class="route-field__part">
            <span class="filter-field__label">From</span>
            <input type="text" value="Geneva" />
          </label>

          <button class="swap-button" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="13"
              viewBox="0 0 14 13"
              fill="none"
            >

                fill="#B4BBC0"
              />
            </svg>
          </button>

          <label class="route-field__part">
            <span class="filter-field__label">To</span>
            <input type="text" value="San Francisco" />
          </label>
        </div>

        <label class="filter-field">
          <span class="filter-field__label">From</span>
          <span class="filter-field__control">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <input type="text" id="depart-date" value="31 May 2027" readonly />

</svg>
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </label>

        <label class="filter-field">
  <span class="filter-field__label">Until</span>
  <span class="filter-field__control">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
    <input type="text" id="return-date" value="15 June 2027" readonly />
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <path d="M10.0592 11.095L14.1842 6.97C14.261 6.89041 14.353 6.82692 14.4547 6.78325C14.5563 6.73957 14.6657 6.71659 14.7763 6.71562C14.887 6.71466 14.9968 6.73575 15.0992 6.77765C15.2015 6.81955 15.2946 6.88143 15.3728 6.95967C15.4511 7.03791 15.5129 7.13096 15.5548 7.23337C15.5968 7.33579 15.6178 7.44552 15.6168 7.55617C15.6159 7.66681 15.5929 7.77616 15.5493 7.87784C15.5056 7.97951 15.4421 8.07146 15.3625 8.14833L10.6483 12.8625C10.4921 13.0187 10.2802 13.1065 10.0592 13.1065C9.83817 13.1065 9.62626 13.0187 9.47001 12.8625L4.75584 8.14833C4.67625 8.07146 4.61277 7.97951 4.56909 7.87784C4.52542 7.77616 4.50242 7.66681 4.50147 7.55617C4.5005 7.44552 4.52159 7.33579 4.56349 7.23337C4.60539 7.13096 4.66727 7.03791 4.74551 6.95967C4.82376 6.88143 4.9168 6.81955 5.01921 6.77765C5.12162 6.73575 5.23136 6.71466 5.34201 6.71562C5.45266 6.71659 5.56201 6.73957 5.66367 6.78325C5.76535 6.82692 5.8573 6.89041 5.93417 6.97L10.0592 11.095Z" fill="white"/>
</svg>
  </span>
</label>

        <label class="filter-field">
          <span class="filter-field__label">Passengers</span>
          <span class="filter-field__control">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
            </svg>
            <input type="number" min="1" value="1" />
          </span>
        </label>

        <button class="btn btn-secondary">Search</button>
      </div>
    </form>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
